version: '3.8'

services:
  volguard:
    build: .
    container_name: volguard_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"  # FastAPI port
    volumes:
      - ./volguard_data:/app/data
      - ./volguard_logs:/app/logs
    env_file: .env
    
    healthcheck:
      # Health check for FastAPI endpoint
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Optional: Grafana for viewing SQLite database
  grafana:
    image: grafana/grafana:latest
    container_name: volguard_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    user: "0:0"
    environment:
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=volguard2024  # CHANGE THIS!
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=frser-sqlite-datasource
    volumes:
      - ./volguard_data:/var/lib/grafana/data/volguard_mount:ro
      - grafana_data:/var/lib/grafana
      - ./config/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro

volumes:
  grafana_data:
